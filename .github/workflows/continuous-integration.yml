name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '5.6'
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: 
          coverage: none
          # Composer 2.3+ needs PHP 7.2.5; the 2.2 LTS line still runs on 5.6.
          tools: ${{ contains(fromJSON('["5.6","7.0","7.1"]'), matrix.php-version) && 'composer:v2.2' || 'composer:v2' }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      # update, not install: no lock file is committed, so each PHP version
      # resolves the PHPUnit and polyfill versions that support it.
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Validate composer.json
        run: composer validate --no-check-lock --no-check-publish

      - name: Run test suite
        run: ./vendor/bin/phpunit
